.llc{display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--kct),var(--card) 120px)}
.llt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.llk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.llh{display:flex;align-items:center;gap:8px;margin-bottom:2px}.llh b{font-size:15px}.llh .lbl{margin-left:auto}
.llit{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 0;background:none;border:none;border-top:1px dashed var(--sep);text-align:left;color:var(--ink);font:inherit}
.llit .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--kc);display:flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0}

.llx{flex:1;min-width:0;display:block}.lt1{display:block;font-size:14px;font-weight:700;color:var(--ink)}.ls1{display:block;font-size:11.5px;color:var(--mut)}.llit.w .ls1{color:var(--rd);font-weight:600}.llc .pill{white-space:nowrap}.llit.on .lt1{text-decoration:line-through;opacity:.6}
.lls{font-size:13px;color:var(--mut);padding:4px 0}.lla{font-size:12px;color:var(--mut);border-top:1px dashed var(--sep);padding-top:6px;line-height:1.45}.lla b{color:var(--ink2)}
.llp{border-top:1px solid var(--sep);padding-top:10px}.llpr{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}.llpr .dt{width:8px;height:8px;border-radius:50%;flex-shrink:0}.llpr b{font-size:12px;color:var(--ink2)}
.semc{border:none;background:var(--kct);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px}.semc span{opacity:.5;margin-left:2px}
.cclock{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;border-bottom:1px solid var(--sep);margin-bottom:6px}
.cagm{position:sticky;top:0;background:var(--card);font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600;padding:12px 0 6px;z-index:1}

.cag .d{width:42px;display:flex;flex-direction:column;align-items:center;flex-shrink:0}.cag .d .w{font-size:10.5px;font-weight:700;color:var(--mut)}.cag .d .n{font-size:21px;font-weight:700;line-height:1.15;width:36px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.cag.today .d .n{background:var(--x);color:#fff}
.cag .rib{width:5px;border-radius:3px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;min-height:40px}.cag .rib i{display:block}
.cag .c{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}.cag .h{font-size:14px;font-weight:700}
.evc{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--seg);border-radius:10px;padding:4px 9px;align-self:flex-start;max-width:100%}.evc i{width:7px;height:7px;border-radius:4px;display:block;flex-shrink:0}
.cgm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cmem{aspect-ratio:.8;border-radius:13px;background:var(--seg);background-size:cover;background-position:center;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:5px;border:none;font:inherit;color:var(--ink)}
.cmem .n{font-size:12px;font-weight:700}.cmem.ph .n{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cmem.out{opacity:.35}.cmem.today{box-shadow:inset 0 0 0 2px var(--ink)}.cmem.sel{box-shadow:inset 0 0 0 2px var(--p),0 0 0 2px var(--p)}
.cmem .md{font-size:8px;font-weight:700;border-radius:6px;padding:1px 4px;background:var(--abt);color:var(--abd)}
.cmem .kd{display:flex}.cmem .kd .kav{width:13px;height:13px;font-size:7px;margin-right:1px}
.vista{font-size:12px;color:var(--mut);text-align:center;padding-top:8px}
.inp{min-width:0;height:44px;border:1px solid var(--line2);border-radius:10px;padding:0 10px;font:inherit;font-size:15px;width:100%;background:var(--card);color:var(--ink)}
.fld{min-width:0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut);font-weight:600}
.tl{position:relative;height:26px;background:var(--seg);border-radius:6px;overflow:hidden;flex:1}
.tl i{position:absolute;top:0;bottom:0;display:block}
.tlw{background:var(--tlw)}.tls{background:var(--ab)}.tla{background:var(--yfill);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 4px,transparent 4px 8px)}.tlc{background:var(--p)}.tlx{background:var(--x);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 4px,transparent 4px 8px)}
.tlrow{display:flex;align-items:center;gap:8px}
.tld{width:30px;font-size:12px;font-weight:700;color:var(--mut);flex-shrink:0}
.tlv{width:52px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px}
.pr{background:var(--rt);color:var(--rd)}.pa{background:var(--yt);color:var(--yd)}.pg{background:var(--pt);color:var(--pd)}
.alert{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}

.split{display:flex;height:12px;border-radius:6px;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;color:var(--p)}

.brand span{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.02em}
.hb{position:relative;width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
.hb i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--x);color:#fff;font-size:11px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line2);border:none;position:relative;flex-shrink:0;padding:0}

.upl{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 10px 40px}

.albg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.albg img{width:100%;height:auto;aspect-ratio:1}

.file{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13px;font-weight:600}
.sigimg{height:44px;border-bottom:1px solid var(--line2);background:#fff;border-radius:6px}

.vista button{border:none;background:none;color:var(--p);font-weight:700;font-size:12px;text-decoration:underline}

}

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

    x.ev.forEach(function(e,k){var tmv=/^\d\d:\d\d$/.test(e[0]);out.push('BEGIN:VEVENT','UID:'+ds+'-'+k+'@nido','DTSTAMP:'+ds+'T000000');

    var local=(S[key]||[]).filter(function(x){return x._id&&!seen[x._id]&&!FB.seen[key][x._id];});/* aún no subidos */
    FB.seen[key]=seen;S[key]=local.concat(arr);FB.got[key]=true;fbReadyCheck();softRender();},fbErr);});}
function fbErr(e){console.error(e);if(e&&e.code==='permission-denied'){toast('Sin permiso para leer los datos. Revisa las reglas de Firestore.');}}

function fbPush(){if(!FB.ready)return;var base=fbBase(),me=S.vista;
  SYNC_KEYS.forEach(function(k){var v=JSON.stringify(S[k]===undefined?null:S[k]);if(v===FB.sent[k])return;if(v.length>900000){toast('Hay demasiadas fotos en «'+k+'». Borra algunas para poder guardar.');return;}FB.sent[k]=v;
    base.collection('estado').doc(k).set({v:v,por:me,en:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(e){console.error(e);toast('No se pudo guardar. Revisa tu conexión.');});});
  Object.keys(COLLS).forEach(function(key){var c=base.collection(COLLS[key]),ids={};
    (S[key]||[]).forEach(function(it){if(!it._id){it._id=(key==='bit'&&it.actaN)?it.actaN+'-'+rid().slice(-4):rid();it._o=Date.now();}ids[it._id]=1;
      var cl=fbClean(it),s=JSON.stringify(cl),prev=FB.seen[key][it._id];if(s===prev)return;
      if(!prev){FB.seen[key][it._id]=s;c.doc(it._id).set(cl).catch(function(e){console.error(e);toast('No se pudo guardar el registro.');});}
      else if(key==='bit'){FB.seen[key][it._id]=s;var up={firma:cl.firma||{}};if(cl.acta)up.acta=cl.acta;if(cl.files)up.files=cl.files;if(cl.actaN)up.actaN=cl.actaN;c.doc(it._id).update(up).catch(function(e){console.error(e);});}
      else if(key==='photos'){FB.seen[key][it._id]=s;c.doc(it._id).set(cl);}});
    if(key==='photos')Object.keys(FB.seen.photos).forEach(function(id){if(!ids[id]){delete FB.seen.photos[id];c.doc(id).delete();}});});}
function schedulePush(){clearTimeout(FB.timer);FB.timer=setTimeout(fbPush,400);}

var _nidoRender=render;
render=function(){_nidoRender();if(FB.ready)schedulePush();};
vistaSel=function(){return '<span style="display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap"><b>'+S.vista+'</b><button class="btn sec" style="height:34px;font-size:13px" data-a="logout">Cerrar sesión</button></span>';};
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a="logout"]');if(b){firebase.auth().signOut().then(function(){location.reload();});}},true);

function nidoBoot(){
  if(typeof firebase==='undefined'){document.body.insertAdjacentHTML('beforeend','<div class="nlog"><div class="nbox"><h1>Nido</h1><p class="nsub">No se pudo cargar la conexión. Revisa tu internet y recarga la página.</p></div></div>');return;}
  firebase.initializeApp(NIDO_CFG);FB.db=firebase.firestore();try{FB.db.settings({experimentalForceLongPolling:true,merge:true});}catch(e){}
  try{FB.db.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
  firebase.auth().onAuthStateChanged(function(u){if(!u){hideLoading();showLogin();return;}
    var who=NIDO_USERS[(u.email||'').toLowerCase()];
    if(!who){firebase.auth().signOut();showLogin('Este correo no tiene acceso a Nido.');return;}
    S.vista=who;hideLogin();showLoading('Cargando los datos de Nido…');setTimeout(function(){if(!FB.ready&&document.getElementById('nidoLoad'))showLoading('Está tardando en conectar con la base de datos. Si estás en la red del trabajo, prueba desde tu celular con datos móviles.');},15000);
    fbBase().collection('estado').doc('work').get().then(function(s){if(!s.exists){showLoading('Preparando Nido por primera vez…');return fbInit();}})
      .then(fbListen).catch(function(e){console.error(e);hideLoading();showLogin(e&&e.code==='permission-denied'?'Tu cuenta no tiene permiso. Revisa las reglas de Firestore.':'No se pudieron cargar los datos ('+(e&&e.code||'error')+').');});});
}

nidoBoot();
</script>
