if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.type==='abrir'&&e.data.tab&&T[e.data.tab]){S.tab=e.data.tab;render();window.scrollTo(0,0);}if(e.data&&e.data.type==='nueva-version'&&!document.getElementById('nidoUpd')){var d=document.createElement('div');d.id='nidoUpd';d.setAttribute('role','status');d.style.cssText='position:fixed;left:12px;right:12px;bottom:92px;z-index:99998;background:#2E1A47;color:#fff;padding:12px 14px;border-radius:14px;font:600 14px/1.3 system-ui,sans-serif;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)';d.innerHTML='<span style="flex:1">Hay una versión nueva de Nido</span><button style="border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:800;background:#fff;color:#2E1A47;cursor:pointer" onclick="location.reload()">Actualizar</button>';document.body.appendChild(d);}});}

window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window._ip=e;if(FB&&FB.ready)render();});
window.addEventListener('appinstalled',function(){window._ip=null;toast('Nido instalada');});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
nidoBoot();
